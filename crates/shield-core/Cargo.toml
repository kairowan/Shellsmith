[package]
name = "shield-core"
version = "1.10.0-rc.1"
edition = "2021"
authors = ["MocikaDev"]
license = "MIT OR Apache-2.0"
description = "Shellsmith 核心加固与签名能力"
repository = "https://github.com/kairowan/Shellsmith"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = { workspace = true }
which = "8.0"
colored = "3.1"
tempfile = "3.10"
directories = { workspace = true }
dunce = "1"
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
